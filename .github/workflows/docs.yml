name: Docs site

# Builds the documentation site (site/) the way avytrix.dev builds it, then runs the SEO gate.
# Not a required check: the site is tooling and never reaches GitLab.
on:
  pull_request:
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_PUBLIC_SITE_URL: https://avytrix.dev
      NEXT_PUBLIC_BASE_PATH: /opensource/gitlab-vela
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: SEO gate
        run: python3 scripts/seo_check.py out
