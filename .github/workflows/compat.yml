name: Compatibility

# Runs the live end-to-end suite against real GitLab CE images, for both tiers. Slow (about 20 minutes a
# job), so it runs weekly and on demand, not on every pull request. A version is listed as supported
# only when its results here are green.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    name: GitLab ${{ matrix.tag }} (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tag: ["19.5.3-ce.0", "19.0.11-ce.0", "19.0.2-ce.0", "18.11.0-ce.0", "17.11.0-ce.0", "16.11.0-ce.0", "15.11.0-ce.0"]
        tier: [hook, overlay]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run the suite
        run: dev/compat.sh "${{ matrix.tag }}" "${{ matrix.tier }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-${{ matrix.tag }}-${{ matrix.tier }}
          path: docs/compat/
          if-no-files-found: ignore
